# Example gateway configuration.
# Non-secret only. SMTP credentials come from the environment:
#   HERALD_SMTP_USERNAME, HERALD_SMTP_PASSWORD
# The database comes from HERALD_DATABASE_URL or --database-url.

[server]
addr = "127.0.0.1:8787"
tenant = "owner"

# Stalwart submission listener on the box. On marcustut/nixos the local domain
# is marcustut.me, so the sender must be a real local mailbox (herald@…) and the
# submission principal's email must match it (must-match-sender = true).
[smtp]
addr = "127.0.0.1:587"
from = "herald@marcustut.me"
# Display name shown by mail clients. Defaults to "Herald" when omitted; set it
# to "" to send the bare address instead.
from_name = "Herald"
# When dialling the submission listener by IP, verify STARTTLS against the
# certificate's name (the box's cert is for mail.marcustut.me).
server_name = "mail.marcustut.me"

# Outbound-delivery hardening. A webhook URL only ever comes from this file;
# these settings constrain those admin-configured URLs. Non-loopback SMTP
# always requires STARTTLS with certificate verification. See docs/security.md.
[security]
# Optional explicit host allowlist for webhook sinks (case-insensitive; a port
# is ignored). When non-empty, every webhook host must be listed here.
webhook_allow_hosts = ["hooks.slack.com"]
# Allow webhook delivery to loopback/private/link-local addresses. Off by
# default so a webhook cannot reach cloud metadata or intranet services.
allow_private_networks = false

# Submit limits, enforced per project at POST /v1/events. Values inherit the
# built-in defaults (60/1m, 2000/day, 20000/month) when omitted. See
# docs/rate-limiting.md.
[limits]
requests = 60
window = "1m"
daily = 2000
monthly = 20000

# Which sinks each project fans out to.
[projects.axis]
sinks = ["email"]

# A project may override any limit; unset fields inherit [limits].
[projects.axis.limits]
requests = 120
window = "1m"

[projects.finance]
sinks = ["email", "slack"]

[sinks.email]
kind = "email"
recipient = "marcus@marcustut.me"

[sinks.slack]
kind = "webhook"
url = "https://hooks.slack.com/services/XXX/YYY/ZZZ"
