# Example gateway configuration.
# Non-secret only. SMTP credentials come from the environment:
#   HERALD_SMTP_USERNAME, HERALD_SMTP_PASSWORD
# The database comes from HERALD_DATABASE_URL or --database-url.
# Need SMTP credentials? See docs/smtp-gmail.md (a Gmail App Password).

[server]
addr = "127.0.0.1:8787"
tenant = "owner"

# SMTP submission host. Prefer a hostname over an IP so STARTTLS can verify the
# certificate — for Gmail, smtp.gmail.com:587 (see docs/smtp-gmail.md). The
# sender must be an address these credentials may send as; many servers require
# it to match the account.
[smtp]
addr = "smtp.example.com:587"
from = "herald@example.com"
# Display name shown by mail clients. Defaults to "Herald" when omitted; set it
# to "" to send the bare address instead.
from_name = "Herald"
# Only needed when dialling an IP address: the certificate name to expect.
# server_name = "mail.example.com"

# Hosted account surface (Herald Cloud). Off by default, so a self-hosted
# deployment exposes no signup/sign-in routes at all. Enable it only on the
# hosted control plane, with the absolute public origin the magic-link callback
# points at; an https origin also makes the session cookie Secure. See
# docs/cloud-auth.md.
[cloud]
enabled = false
# base_url = "https://cloud.example.com"
# Provider bounce/complaint webhook. When true, POST /cloud/v1/email/events
# ingests SES/SNS (or generic) notifications and suppresses hard-bounced or
# complaining addresses. Requires HERALD_BOUNCE_WEBHOOK_SECRET and cloud.enabled.
# See docs/deliverability.md.
# bounce_webhook = false

# Outbound-delivery hardening. A webhook URL only ever comes from this file;
# these settings constrain those admin-configured URLs. Non-loopback SMTP
# always requires STARTTLS with certificate verification. See docs/security.md.
[security]# Optional explicit host allowlist for webhook sinks (case-insensitive; a port
# is ignored). When non-empty, every webhook host must be listed here.
webhook_allow_hosts = ["hooks.slack.com"]
# Allow webhook delivery to loopback/private/link-local addresses. Off by
# default so a webhook cannot reach cloud metadata or intranet services.
allow_private_networks = false

# Submit limits, enforced per project at POST /v1/events. Values inherit the
# built-in defaults (60/1m, 2000/day, 20000/month) when omitted. See
# docs/rate-limiting.md.
[limits]
requests = 60
window = "1m"
daily = 2000
monthly = 20000

# Which sinks each project fans out to.
[projects.axis]
sinks = ["email"]

# A project may override any limit; unset fields inherit [limits].
[projects.axis.limits]
requests = 120
window = "1m"

[projects.finance]
sinks = ["email", "slack"]

[sinks.email]
kind = "email"
recipient = "you@example.com"

[sinks.slack]
kind = "webhook"
url = "https://hooks.slack.com/services/XXX/YYY/ZZZ"
