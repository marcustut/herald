openapi: 3.1.0
info:
  title: Herald API
  version: "1.0.0"
  description: |
    Herald accepts agent "work finished" events over HTTPS, authenticates the
    token, pins the destination from the credential, redacts secrets, and queues
    delivery to the configured sinks.

    The canonical endpoint is `POST /v1/events`. `POST /v1/reports` is a
    deprecated alias that behaves identically and answers with `Deprecation: true`
    and `Link: </v1/events>; rel="successor-version"`.

    The **control plane** shares the same `/v1` surface. It is part of the
    product and requires a database-backed gateway: a gateway without a database
    registers none of the control-plane routes and every such path answers
    `404`, and the in-memory `--dev` mode has no control plane either. One
    signed-in tenant owns projects, tokens and
    delivery destinations through a cookie session and a CSRF token. Every
    control-plane route may answer `503 unavailable` when a dependency
    (database, mailer) fails. See
    [docs/control-plane.md](docs/control-plane.md).

    This document mirrors the implemented contract; the human-readable
    reference is [docs/http-api.md](docs/http-api.md). All examples use the
    placeholder host `herald.example.com`.
  license:
    name: MIT
    identifier: MIT
servers:
  - url: https://herald.example.com
    description: Placeholder origin — replace with your deployment.
tags:
  - name: Events
    description: Report-token authenticated event submission and session-authenticated listing.
  - name: Auth
    description: Magic-link sign-in, callback, session and account lifecycle. Control-plane routes; database-backed gateways only.
  - name: Projects
    description: Tenant-owned projects and their API tokens. Session + CSRF. Control-plane routes; database-backed gateways only.
  - name: Tokens
    description: API token metadata and revocation. Session + CSRF. Control-plane routes; database-backed gateways only.
  - name: Destinations
    description: Per-project delivery destinations and email verification. Session + CSRF. Control-plane routes; database-backed gateways only.
  - name: Log
    description: Tenant-scoped read-only event and delivery log. Session auth. Control-plane routes; database-backed gateways only.
  - name: Health
    description: Unauthenticated liveness, readiness and metrics probes.
security:
  - bearerAuth: []
paths:
  /v1/events:
    get:
      tags: [Log]
      summary: List the tenant's events
      description: |
        Returns the signed-in tenant's events, newest first, with optional
        project, status and date filters. Session-authenticated (the cookie
        session), unlike `POST`, which uses a report token. The page carries the
        redacted title; the body is never returned. `limit`/`offset` paginate and
        `page.hasMore` is exact.
      operationId: listEvents
      security:
        - sessionAuth: []
      parameters:
        - $ref: "#/components/parameters/Project"
        - $ref: "#/components/parameters/Status"
        - $ref: "#/components/parameters/Since"
        - $ref: "#/components/parameters/Until"
        - $ref: "#/components/parameters/Limit"
        - $ref: "#/components/parameters/Offset"
      responses:
        "200":
          description: The tenant's events, newest first.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/EventLogList"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "422":
          $ref: "#/components/responses/ValidationFailed"
        "405":
          $ref: "#/components/responses/MethodNotAllowed"
    post:
      tags: [Events]
      summary: Submit an event
      description: |
        Accepts one agent event and returns its id. Idempotent when a stable
        `occurrenceId` (or legacy `idempotencyKey`) is supplied.
      operationId: submitEvent
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/EventRequest"
            examples:
              success:
                summary: A finished task
                value:
                  project: axis
                  status: success
                  title: deploy finished
                  body: main is green; 3 commits shipped
                  links:
                    - label: PR
                      url: https://github.com/example/repo/pull/42
                  context:
                    host: ci-runner-7
                  agent: herdr-build
                  occurrenceId: deploy-2026-10-13
      responses:
        "202":
          description: Event accepted and queued for delivery.
          headers:
            X-RateLimit-Limit:
              $ref: "#/components/headers/XRateLimitLimit"
            X-RateLimit-Remaining:
              $ref: "#/components/headers/XRateLimitRemaining"
            X-RateLimit-Reset:
              $ref: "#/components/headers/XRateLimitReset"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/EventAccepted"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "413":
          $ref: "#/components/responses/PayloadTooLarge"
        "415":
          $ref: "#/components/responses/UnsupportedMediaType"
        "422":
          $ref: "#/components/responses/ValidationFailed"
        "429":
          $ref: "#/components/responses/RateLimited"
        "503":
          $ref: "#/components/responses/ServiceUnavailable"
  /v1/reports:
    post:
      tags: [Events]
      deprecated: true
      summary: Deprecated alias for POST /v1/events
      description: |
        Deprecated. Identical request and response to `POST /v1/events`, with
        `Deprecation: true` and `Link: </v1/events>; rel="successor-version"`
        added to every response. Migrate to `/v1/events`.
      operationId: submitReportAlias
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/EventRequest"
      responses:
        "202":
          description: Event accepted and queued for delivery.
          headers:
            Deprecation:
              $ref: "#/components/headers/Deprecation"
            Link:
              $ref: "#/components/headers/SuccessorVersion"
            X-RateLimit-Limit:
              $ref: "#/components/headers/XRateLimitLimit"
            X-RateLimit-Remaining:
              $ref: "#/components/headers/XRateLimitRemaining"
            X-RateLimit-Reset:
              $ref: "#/components/headers/XRateLimitReset"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/EventAccepted"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "413":
          $ref: "#/components/responses/PayloadTooLarge"
        "415":
          $ref: "#/components/responses/UnsupportedMediaType"
        "422":
          $ref: "#/components/responses/ValidationFailed"
        "429":
          $ref: "#/components/responses/RateLimited"
        "503":
          $ref: "#/components/responses/ServiceUnavailable"
  /v1/auth/magic-link:
    post:
      tags: [Auth]
      summary: Request a magic sign-in link
      description: |
        Mails a single-use, 15-minute sign-in link to `email`. Always answers
        `202` for a syntactically valid address, registered or not, so the
        endpoint cannot enumerate accounts. Rate limited per client IP and per
        target address (10/minute by default). Control-plane route; `404` on a
        gateway without a database.
      operationId: requestMagicLink
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/MagicLinkRequest"
      responses:
        "202":
          description: The request was accepted.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/StatusMessage"
        "400":
          $ref: "#/components/responses/BadRequest"
        "415":
          $ref: "#/components/responses/UnsupportedMediaType"
        "422":
          description: The email address is not valid.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
              example:
                error:
                  code: validation_failed
                  message: a valid email is required
                  field: email
        "429":
          $ref: "#/components/responses/RateLimited"
  /v1/auth/callback:
    get:
      tags: [Auth]
      summary: Redeem a magic link and start a session
      description: |
        Redeems the single-use link token, sets the `herald_session` cookie and
        returns the CSRF token plus the signed-in user. A replayed, expired or
        unknown token answers `401`.
      operationId: redeemMagicLink
      security: []
      parameters:
        - $ref: "#/components/parameters/AuthToken"
      responses:
        "200":
          description: Session started; the cookie is set on the response.
          headers:
            Set-Cookie:
              description: The `herald_session` cookie (`HttpOnly`, `SameSite=Strict`, `Secure` on an https origin).
              schema:
                type: string
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Session"
        "401":
          $ref: "#/components/responses/Unauthorized"
  /v1/me:
    get:
      tags: [Auth]
      summary: The signed-in user
      operationId: getMe
      security:
        - sessionAuth: []
      responses:
        "200":
          description: The identity behind the session cookie.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/UserResponse"
        "401":
          $ref: "#/components/responses/Unauthorized"
  /v1/auth/signout:
    post:
      tags: [Auth]
      summary: Sign out
      description: Revokes the session and clears the cookie. Requires the CSRF token.
      operationId: signOut
      security:
        - sessionAuth: []
      parameters:
        - $ref: "#/components/parameters/CSRFToken"
      responses:
        "204":
          description: The session was revoked and the cookie cleared.
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
  /v1/account:
    delete:
      tags: [Auth]
      summary: Delete the account
      description: |
        Deletes the account and everything it owns (user, tenants, projects,
        destinations and sessions) and clears the cookie. Permanent. Requires
        the CSRF token.
      operationId: deleteAccount
      security:
        - sessionAuth: []
      parameters:
        - $ref: "#/components/parameters/CSRFToken"
      responses:
        "204":
          description: The account and its rows were deleted.
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
  /v1/projects:
    get:
      tags: [Projects]
      summary: List the tenant's projects
      operationId: listProjects
      security:
        - sessionAuth: []
      responses:
        "200":
          description: The session tenant's projects.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ProjectList"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "405":
          $ref: "#/components/responses/MethodNotAllowed"
    post:
      tags: [Projects]
      summary: Create a project
      description: Creates a project owned by the session tenant. Requires the CSRF token.
      operationId: createProject
      security:
        - sessionAuth: []
      parameters:
        - $ref: "#/components/parameters/CSRFToken"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ProjectRequest"
      responses:
        "201":
          description: The project was created.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ProjectResponse"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "415":
          $ref: "#/components/responses/UnsupportedMediaType"
        "422":
          $ref: "#/components/responses/ValidationFailed"
  /v1/projects/{project}:
    delete:
      tags: [Projects]
      summary: Delete a project
      description: |
        Deletes the project and its destinations. A project owned by another
        tenant is indistinguishable from a missing one (`404`). Requires the
        CSRF token.
      operationId: deleteProject
      security:
        - sessionAuth: []
      parameters:
        - $ref: "#/components/parameters/ProjectPath"
        - $ref: "#/components/parameters/CSRFToken"
      responses:
        "204":
          description: The project was deleted.
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
  /v1/tokens:
    get:
      tags: [Tokens]
      summary: List token metadata
      description: |
        Lists the tenant's token metadata, newest first. `id` is the stored
        one-way token hash; the raw secret is never stored or returned.
      operationId: listTokens
      security:
        - sessionAuth: []
      responses:
        "200":
          description: The tenant's tokens.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TokenList"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "405":
          $ref: "#/components/responses/MethodNotAllowed"
    post:
      tags: [Tokens]
      summary: Create a multi-project token
      description: |
        Mints a `heraldacct_…` token scoped to `projects`. Every project must
        belong to the session tenant. The raw secret is returned exactly once
        (`Cache-Control: no-store`) and never stored. Requires the CSRF token.
      operationId: createScopedToken
      security:
        - sessionAuth: []
      parameters:
        - $ref: "#/components/parameters/CSRFToken"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ScopedTokenRequest"
      responses:
        "201":
          description: The new token; the secret is shown once.
          headers:
            Cache-Control:
              $ref: "#/components/headers/NoStore"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TokenIssued"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "415":
          $ref: "#/components/responses/UnsupportedMediaType"
        "422":
          $ref: "#/components/responses/ValidationFailed"
  /v1/tokens/{id}:
    delete:
      tags: [Tokens]
      summary: Revoke a token
      description: |
        Revokes the token identified by its hash `id`. Revocation is immediate:
        the next submit with that secret answers `401`. Requires the CSRF token.
      operationId: revokeToken
      security:
        - sessionAuth: []
      parameters:
        - $ref: "#/components/parameters/TokenIDPath"
        - $ref: "#/components/parameters/CSRFToken"
      responses:
        "204":
          description: The token was revoked.
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
  /v1/projects/{project}/token:
    post:
      tags: [Tokens]
      summary: Create a project token
      description: |
        Mints a least-privilege `herald_<project>_<secret>` token for the
        project. The raw secret is returned exactly once
        (`Cache-Control: no-store`). Requires the CSRF token.
      operationId: createProjectToken
      security:
        - sessionAuth: []
      parameters:
        - $ref: "#/components/parameters/ProjectPath"
        - $ref: "#/components/parameters/CSRFToken"
      responses:
        "201":
          description: The new project token; the secret is shown once.
          headers:
            Cache-Control:
              $ref: "#/components/headers/NoStore"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TokenIssued"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
  /v1/projects/{project}/token/rotate:
    post:
      tags: [Tokens]
      summary: Rotate a project token
      description: |
        Issues a replacement project token and revokes the previous one(s) in
        one operation. The raw secret is returned exactly once. Requires the
        CSRF token.
      operationId: rotateProjectToken
      security:
        - sessionAuth: []
      parameters:
        - $ref: "#/components/parameters/ProjectPath"
        - $ref: "#/components/parameters/CSRFToken"
      responses:
        "201":
          description: The replacement token; the secret is shown once.
          headers:
            Cache-Control:
              $ref: "#/components/headers/NoStore"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TokenIssued"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
  /v1/projects/{project}/destinations:
    get:
      tags: [Destinations]
      summary: List a project's destinations
      operationId: listDestinations
      security:
        - sessionAuth: []
      parameters:
        - $ref: "#/components/parameters/ProjectPath"
      responses:
        "200":
          description: The project's destinations.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DestinationList"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"
        "405":
          $ref: "#/components/responses/MethodNotAllowed"
    post:
      tags: [Destinations]
      summary: Create a destination
      description: |
        Creates an `email` or `webhook` destination. An email destination is
        created unverified and must be confirmed before it is delivered to.
        Requires the CSRF token.
      operationId: createDestination
      security:
        - sessionAuth: []
      parameters:
        - $ref: "#/components/parameters/ProjectPath"
        - $ref: "#/components/parameters/CSRFToken"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/DestinationRequest"
      responses:
        "201":
          description: The destination was created.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DestinationResponse"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "415":
          $ref: "#/components/responses/UnsupportedMediaType"
        "422":
          $ref: "#/components/responses/ValidationFailed"
  /v1/projects/{project}/destinations/{id}:
    delete:
      tags: [Destinations]
      summary: Delete a destination
      description: |
        Removes the destination and its outstanding verification tokens.
        Requires the CSRF token.
      operationId: deleteDestination
      security:
        - sessionAuth: []
      parameters:
        - $ref: "#/components/parameters/ProjectPath"
        - $ref: "#/components/parameters/DestinationIDPath"
        - $ref: "#/components/parameters/CSRFToken"
      responses:
        "204":
          description: The destination was removed.
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
  /v1/projects/{project}/destinations/{id}/verify:
    post:
      tags: [Destinations]
      summary: Send a fresh email verification link
      description: |
        Mails a fresh, single-use verification link to an email destination's
        address. Rate limited per client IP. Requires the CSRF token.
      operationId: requestDestinationVerification
      security:
        - sessionAuth: []
      parameters:
        - $ref: "#/components/parameters/ProjectPath"
        - $ref: "#/components/parameters/DestinationIDPath"
        - $ref: "#/components/parameters/CSRFToken"
      responses:
        "202":
          description: The verification link was sent.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/StatusMessage"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "422":
          description: The destination kind cannot be verified by email.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
              example:
                error:
                  code: not_verifiable
                  message: this destination kind cannot be verified by email
                  field: kind
        "429":
          $ref: "#/components/responses/RateLimited"
  /v1/destinations/verify:
    get:
      tags: [Destinations]
      summary: Confirm an email destination
      description: |
        Redeems the verification token from the emailed link. Token-only, like
        the sign-in callback: the recipient need not hold a session, because the
        token row already names the destination it verifies.
      operationId: confirmDestinationVerification
      security: []
      parameters:
        - $ref: "#/components/parameters/VerifyToken"
      responses:
        "200":
          description: The address was confirmed.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/StatusMessage"
              example:
                status: verified
        "404":
          $ref: "#/components/responses/NotFound"
  /v1/deliveries:
    get:
      tags: [Log]
      summary: List the tenant's delivery attempts
      description: |
        Returns the signed-in tenant's delivery attempts, newest first, joined
        to the owning event. `lastError` is redacted. Session-authenticated.
      operationId: listDeliveries
      security:
        - sessionAuth: []
      parameters:
        - $ref: "#/components/parameters/Project"
        - $ref: "#/components/parameters/Event"
        - $ref: "#/components/parameters/State"
        - $ref: "#/components/parameters/Since"
        - $ref: "#/components/parameters/Until"
        - $ref: "#/components/parameters/Limit"
        - $ref: "#/components/parameters/Offset"
      responses:
        "200":
          description: The tenant's delivery attempts, newest first.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DeliveryLogList"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "422":
          $ref: "#/components/responses/ValidationFailed"
  /v1/email/events:
    post:
      tags: [Events]
      summary: Ingest a provider bounce or complaint
      description: |
        Ingests one provider notification (an SES-via-SNS envelope or the
        generic shape). Shared-secret authenticated with the
        `HERALD_BOUNCE_WEBHOOK_SECRET`; replay-safe by provider event id. A hard
        bounce or a complaint adds the address to the platform-wide suppression
        list. Mounted only under `[auth] bounce_webhook = true` with the secret
        set; otherwise `404`.
      operationId: ingestEmailEvent
      security:
        - providerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/EmailEvent"
      responses:
        "202":
          description: The batch was processed; `accepted` counts newly recorded events.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/EmailEventAccepted"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "422":
          $ref: "#/components/responses/ValidationFailed"
  /healthz:
    get:
      tags: [Health]
      summary: Liveness probe
      security: []
      operationId: healthz
      responses:
        "200":
          description: The process is serving.
          content:
            text/plain:
              schema:
                type: string
                const: "ok"
  /readyz:
    get:
      tags: [Health]
      summary: Readiness probe
      security: []
      operationId: readyz
      responses:
        "200":
          description: The database is reachable and the dispatcher is progressing.
          content:
            text/plain:
              schema:
                type: string
                const: "ready"
        "503":
          $ref: "#/components/responses/Unavailable"
  /metrics:
    get:
      tags: [Health]
      summary: Prometheus metrics
      security: []
      operationId: metrics
      responses:
        "200":
          description: Prometheus text exposition.
          content:
            text/plain:
              schema:
                type: string
components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      description: |
        A report token: `herald_<project>_<secret>` (single project) or
        `heraldacct_<secret>` (scoped; the request body must name the target
        project). Issued by `herald token create` or the control plane. Used
        only by `POST /v1/events` and its deprecated alias.
    sessionAuth:
      type: apiKey
      in: cookie
      name: herald_session
      description: |
        The control-plane browser session cookie, set by
        `GET /v1/auth/callback`. `HttpOnly`, `SameSite=Strict`, and `Secure` on
        an https origin. State-changing requests must additionally carry the
        `X-CSRF-Token` header.
    providerAuth:
      type: http
      scheme: bearer
      description: |
        The provider webhook shared secret (`HERALD_BOUNCE_WEBHOOK_SECRET`)
        presented as a bearer token. Used only by `POST /v1/email/events`.
  parameters:
    CSRFToken:
      name: X-CSRF-Token
      in: header
      required: true
      description: |
        The synchronizer token returned at sign-in. Required on every
        state-changing control-plane request; compared in constant time. A
        missing or wrong token answers `403`.
      schema:
        type: string
    Project:
      name: project
      in: query
      required: false
      description: Restrict to one project slug. Empty means every project the tenant owns.
      schema:
        type: string
    Status:
      name: status
      in: query
      required: false
      description: Restrict to one event status.
      schema:
        type: string
        enum: [success, failure, blocked]
    Event:
      name: event
      in: query
      required: false
      description: Restrict to one event id.
      schema:
        type: string
    State:
      name: state
      in: query
      required: false
      description: Restrict to one delivery state.
      schema:
        type: string
        enum: [pending, inflight, delivered, dead]
    Since:
      name: since
      in: query
      required: false
      description: Inclusive lower bound. An RFC3339 timestamp or a bare `YYYY-MM-DD` date.
      schema:
        type: string
    Until:
      name: until
      in: query
      required: false
      description: Exclusive upper bound. An RFC3339 timestamp or a bare `YYYY-MM-DD` date.
      schema:
        type: string
    Limit:
      name: limit
      in: query
      required: false
      description: Page size. Clamped to 1–100; defaults to 25.
      schema:
        type: integer
        minimum: 1
        maximum: 100
        default: 25
    Offset:
      name: offset
      in: query
      required: false
      description: Row offset. Clamped to 0–100000; defaults to 0.
      schema:
        type: integer
        minimum: 0
        maximum: 100000
        default: 0
    ProjectPath:
      name: project
      in: path
      required: true
      description: Project slug, owned by the session tenant.
      schema:
        type: string
    DestinationIDPath:
      name: id
      in: path
      required: true
      description: Destination id.
      schema:
        type: string
    TokenIDPath:
      name: id
      in: path
      required: true
      description: Token id — the stored, one-way token hash.
      schema:
        type: string
    AuthToken:
      name: token
      in: query
      required: true
      description: The single-use magic-link token.
      schema:
        type: string
    VerifyToken:
      name: token
      in: query
      required: true
      description: The single-use destination-verification token.
      schema:
        type: string
  headers:
    XRateLimitLimit:
      description: The submit limit closest to exhaustion, when a limit is active.
      schema:
        type: integer
    XRateLimitRemaining:
      description: Submits left in that limit's window.
      schema:
        type: integer
    XRateLimitReset:
      description: Unix seconds when that window resets.
      schema:
        type: integer
    RetryAfter:
      description: Whole seconds to wait before retrying (never below 1).
      schema:
        type: integer
        minimum: 1
    Deprecation:
      description: Present on `/v1/reports` responses.
      schema:
        type: string
        const: "true"
    SuccessorVersion:
      description: Points to the replacement endpoint.
      schema:
        type: string
        const: '</v1/events>; rel="successor-version"'
    NoStore:
      description: Set on a freshly minted token so no shared cache keeps the secret.
      schema:
        type: string
        const: "no-store"
  schemas:
    EventRequest:
      type: object
      additionalProperties: true
      required: [status, title, agent]
      properties:
        project:
          type: string
          description: |
            Project slug. Required for a scoped token; for a project token it may
            be omitted and, if present, must match the token's project.
        status:
          type: string
          enum: [success, failure, blocked]
          description: Outcome. Case-insensitive; stored lowercase.
        title:
          type: string
          maxLength: 200
          description: Short summary. Required after trimming.
        body:
          type: string
          maxLength: 65536
          description: Free-text details.
        links:
          type: array
          maxItems: 20
          items:
            $ref: "#/components/schemas/Link"
        context:
          type: object
          maxProperties: 8
          description: |
            Bounded metadata. Keys are `[a-z0-9_-]`, at most 32 chars, and may
            not be `agent`, `project`, `tenant` or `status`. Values are at most
            128 chars with no control characters.
          additionalProperties:
            type: string
            maxLength: 128
        agent:
          type: string
          pattern: "^[a-z0-9]([a-z0-9-]*[a-z0-9])?$"
          maxLength: 64
          description: Agent slug. Required over HTTP; the CLI and MCP tool default it.
        occurrenceId:
          type: string
          pattern: "^[A-Za-z0-9_.:-]+$"
          maxLength: 124
          description: Stable id for one logical event; a safe retry key.
        idempotencyKey:
          type: string
          pattern: "^[A-Za-z0-9_.:-]+$"
          maxLength: 128
          description: Legacy retry key; alternative to `occurrenceId`.
    Link:
      type: object
      required: [label, url]
      additionalProperties: false
      properties:
        label:
          type: string
          maxLength: 64
        url:
          type: string
          maxLength: 2048
          format: uri
          pattern: "^https?://"
          description: Absolute http/https URL only.
    EventAccepted:
      type: object
      required: [id]
      additionalProperties: false
      properties:
        id:
          type: string
          example: evt_01JABCXYZ
    MagicLinkRequest:
      type: object
      required: [email]
      additionalProperties: false
      properties:
        email:
          type: string
          format: email
    StatusMessage:
      type: object
      required: [status]
      additionalProperties: false
      properties:
        status:
          type: string
          example: sent
    User:
      type: object
      required: [id, email, accountId, tenantId]
      additionalProperties: false
      properties:
        id:
          type: string
          example: usr_01JABCXYZ
        email:
          type: string
          format: email
        accountId:
          type: string
          example: acct_01JABCXYZ
        tenantId:
          type: string
          example: ten_01JABCXYZ
    UserResponse:
      type: object
      required: [user]
      additionalProperties: false
      properties:
        user:
          $ref: "#/components/schemas/User"
    Session:
      type: object
      required: [csrfToken, user]
      additionalProperties: false
      properties:
        csrfToken:
          type: string
          description: The synchronizer token to send as `X-CSRF-Token` on mutations.
        user:
          $ref: "#/components/schemas/User"
    ProjectRequest:
      type: object
      required: [id, name]
      additionalProperties: false
      properties:
        id:
          type: string
          description: Project slug.
          example: axis
        name:
          type: string
          description: Display name.
          example: Axis
    Project:
      type: object
      required: [id, name, createdAt]
      additionalProperties: false
      properties:
        id:
          type: string
        name:
          type: string
        createdAt:
          type: string
          format: date-time
    ProjectResponse:
      type: object
      required: [project]
      additionalProperties: false
      properties:
        project:
          $ref: "#/components/schemas/Project"
    ProjectList:
      type: object
      required: [projects]
      additionalProperties: false
      properties:
        projects:
          type: array
          items:
            $ref: "#/components/schemas/Project"
    Token:
      type: object
      required: [id, kind, projects, createdAt]
      additionalProperties: false
      description: Token metadata. `id` is the stored one-way token hash; the secret is never returned here.
      properties:
        id:
          type: string
        kind:
          type: string
          enum: [project, scoped]
        projects:
          type: array
          items:
            type: string
        createdAt:
          type: string
          format: date-time
        lastUsedAt:
          type: string
          format: date-time
          description: When the token last authenticated a submit; absent if never used.
        revokedAt:
          type: string
          format: date-time
          description: Present once the token is revoked.
    TokenList:
      type: object
      required: [tokens]
      additionalProperties: false
      properties:
        tokens:
          type: array
          items:
            $ref: "#/components/schemas/Token"
    ScopedTokenRequest:
      type: object
      required: [projects]
      additionalProperties: false
      properties:
        projects:
          type: array
          minItems: 1
          items:
            type: string
    TokenIssued:
      type: object
      required: [token, kind, projects]
      additionalProperties: false
      description: A freshly minted token. The raw `token` is shown once and never stored.
      properties:
        token:
          type: string
        kind:
          type: string
          enum: [project, scoped]
        projects:
          type: array
          items:
            type: string
    DestinationRequest:
      type: object
      required: [kind, target]
      additionalProperties: false
      properties:
        kind:
          type: string
          enum: [email, webhook]
        target:
          type: string
    Destination:
      type: object
      required: [id, kind, target, enabled, verified, createdAt]
      additionalProperties: false
      properties:
        id:
          type: string
        kind:
          type: string
          enum: [email, webhook]
        target:
          type: string
        enabled:
          type: boolean
        verified:
          type: boolean
        verifiedAt:
          type: string
          format: date-time
          description: Present once an email destination is verified.
        createdAt:
          type: string
          format: date-time
    DestinationResponse:
      type: object
      required: [destination]
      additionalProperties: false
      properties:
        destination:
          $ref: "#/components/schemas/Destination"
    DestinationList:
      type: object
      required: [destinations]
      additionalProperties: false
      properties:
        destinations:
          type: array
          items:
            $ref: "#/components/schemas/Destination"
    EventLog:
      type: object
      required: [id, project, agent, status, title, createdAt]
      additionalProperties: false
      description: One event row. `title` is redacted; the body is never returned.
      properties:
        id:
          type: string
        project:
          type: string
        agent:
          type: string
        status:
          type: string
          enum: [success, failure, blocked]
        title:
          type: string
        createdAt:
          type: string
          format: date-time
    Page:
      type: object
      required: [limit, offset, hasMore]
      additionalProperties: false
      properties:
        limit:
          type: integer
        offset:
          type: integer
        hasMore:
          type: boolean
          description: Exact; true when another page follows.
    EventLogList:
      type: object
      required: [events, page]
      additionalProperties: false
      properties:
        events:
          type: array
          items:
            $ref: "#/components/schemas/EventLog"
        page:
          $ref: "#/components/schemas/Page"
    DeliveryLog:
      type: object
      required: [id, eventId, sink, state, attempts, nextAttemptAt, updatedAt]
      additionalProperties: false
      description: One delivery attempt. `lastError` is redacted.
      properties:
        id:
          type: string
        eventId:
          type: string
        sink:
          type: string
        state:
          type: string
          enum: [pending, inflight, delivered, dead]
        attempts:
          type: integer
        nextAttemptAt:
          type: string
          format: date-time
        lastError:
          type: string
        updatedAt:
          type: string
          format: date-time
    DeliveryLogList:
      type: object
      required: [deliveries, page]
      additionalProperties: false
      properties:
        deliveries:
          type: array
          items:
            $ref: "#/components/schemas/DeliveryLog"
        page:
          $ref: "#/components/schemas/Page"
    EmailEvent:
      type: object
      additionalProperties: true
      description: |
        A provider notification. Either the SES-via-SNS envelope (`Type`,
        `Message`) or the generic shape (`{id, type, recipient|address,
        permanent}`). Unknown shapes answer `422`. An SNS subscription
        confirmation is acknowledged without being fetched.
    EmailEventAccepted:
      type: object
      required: [accepted]
      additionalProperties: false
      properties:
        accepted:
          type: integer
          description: How many events were newly recorded (a replay is not counted).
    Error:
      type: object
      required: [error]
      additionalProperties: false
      properties:
        error:
          $ref: "#/components/schemas/ErrorDetail"
    ErrorDetail:
      type: object
      required: [code, message]
      additionalProperties: false
      properties:
        code:
          type: string
          description: Stable, machine-readable error code.
          enum:
            - invalid_json
            - unauthenticated
            - payload_too_large
            - unsupported_media_type
            - validation_failed
            - rate_limited
            - queue_full
            - unavailable
            - csrf_failed
            - project_not_found
            - token_not_found
            - destination_not_found
            - invalid_verification
            - not_verifiable
        message:
          type: string
        field:
          type: string
          description: Present only for `validation_failed`.
          enum: [title, body, status, links, agent, context, idempotencyKey, occurrenceId, email, kind, target]
  responses:
    BadRequest:
      description: The request body could not be read or was not valid JSON.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
          example:
            error:
              code: invalid_json
              message: malformed JSON
    Unauthorized:
      description: |
        Missing, invalid, revoked or out-of-scope bearer token, or an absent,
        expired or revoked session cookie.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
          example:
            error:
              code: unauthenticated
              message: invalid or out-of-scope token
    PayloadTooLarge:
      description: The request body exceeds the server's maximum (default 256 KiB).
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
          example:
            error:
              code: payload_too_large
              message: request body too large
    UnsupportedMediaType:
      description: Content-Type is missing or not application/json.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
          example:
            error:
              code: unsupported_media_type
              message: Content-Type must be application/json
    ValidationFailed:
      description: Well-formed JSON that violates a validation rule.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
          example:
            error:
              code: validation_failed
              message: title is required
              field: title
    RateLimited:
      description: A submit, sign-in or verification budget is exhausted.
      headers:
        Retry-After:
          $ref: "#/components/headers/RetryAfter"
        X-RateLimit-Limit:
          $ref: "#/components/headers/XRateLimitLimit"
        X-RateLimit-Remaining:
          $ref: "#/components/headers/XRateLimitRemaining"
        X-RateLimit-Reset:
          $ref: "#/components/headers/XRateLimitReset"
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
          example:
            error:
              code: rate_limited
              message: submit limit exceeded
    Forbidden:
      description: |
        The `X-CSRF-Token` header is missing or does not match the session. The
        comparison is constant time.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
          example:
            error:
              code: csrf_failed
              message: missing or invalid CSRF token
    NotFound:
      description: |
        The row is absent, or it belongs to another tenant and is deliberately
        indistinguishable from one that does not exist. The `code` names the
        kind: `project_not_found`, `token_not_found`, `destination_not_found` or
        `invalid_verification`.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
          example:
            error:
              code: project_not_found
              message: no such project
    MethodNotAllowed:
      description: |
        The path exists but not with this method. Emitted by the router as a
        plain-text `405` with an `Allow` header.
      headers:
        Allow:
          description: The methods registered for this path.
          schema:
            type: string
      content:
        text/plain:
          schema:
            type: string
            const: "Method Not Allowed\n"
    ServiceUnavailable:
      description: |
        The project delivery queue is congested (`queue_full`), or a dependency
        (database, credential store) failed (`unavailable`). Both are safe to
        retry; honour `Retry-After` when present.
      headers:
        Retry-After:
          $ref: "#/components/headers/RetryAfter"
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
          examples:
            queueFull:
              value:
                error:
                  code: queue_full
                  message: the project delivery queue is congested; retry later
            unavailable:
              value:
                error:
                  code: unavailable
                  message: service unavailable
    Unavailable:
      description: A dependency failed; safe to retry.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
          example:
            error:
              code: unavailable
              message: service unavailable
