version: "2"

linters:
  default: standard
  enable:
    - bodyclose
    - errorlint
    - misspell
    - unconvert
  exclusions:
    presets:
      - std-error-handling
    rules:
      # Response bodies in tests are closed by a t.Cleanup helper the linter
      # cannot see through.
      - path: _test\.go
        linters:
          - bodyclose
          - errcheck

formatters:
  enable:
    - gofmt
