# Example gateway configuration for the Docker/Compose deployment.
#
#   cp gateway.docker.example.toml gateway.toml   # then edit and keep it local
#
# gateway.toml is gitignored: it is deployment-specific, not part of the image.
# Only non-secret settings live here. SMTP credentials come from the environment
# (HERALD_SMTP_USERNAME / HERALD_SMTP_PASSWORD); the database comes from
# HERALD_DATABASE_URL. See docs/self-hosting-docker.md.

[server]
# Bind all interfaces inside the container so the published port can reach it.
# Do NOT use 127.0.0.1 here.
addr = "0.0.0.0:8787"

# Replace with your real SMTP submission host. A container cannot reach the
# host's loopback, so use a hostname (e.g. host.docker.internal) or another
# Compose service. For Gmail use smtp.gmail.com:587 — see docs/smtp-gmail.md.
[smtp]
addr = "smtp.example.com:587"
from = "herald@example.com"
server_name = "smtp.example.com"

# Account/control-plane surface. Accounts are always on when a database is
# configured; base_url is the public base the API is served under (the
# magic-link callback path is appended to it, and it may include a prefix such
# as /api). An https origin makes the session cookie Secure. See
# docs/control-plane.md.
[auth]
base_url = "http://localhost:8787"
# signup = true lets a request for an unknown address provision and mail a new
# account; set it false to restrict sign-in to existing accounts.
signup = true

# Outbound-delivery hardening (see docs/security.md). A webhook URL only ever
# comes from the database. Non-loopback SMTP always requires STARTTLS with
# certificate verification.
[security]
# Optional explicit host allowlist for webhook destinations (case-insensitive; a
# port is ignored). When non-empty, every webhook host must be listed here.
# webhook_allow_hosts = ["hooks.example.com"]
# Allow webhook delivery to loopback/private/link-local addresses. Off by
# default so a webhook cannot reach cloud metadata or intranet services.
allow_private_networks = false

# Submit limits, enforced per (tenant, project). Omit to use the built-in
# bounded defaults (60/1m, 2000/day, 20000/month). See docs/rate-limiting.md.
[limits]
requests = 60
window = "1m"
daily = 2000
monthly = 20000

# Projects and destinations are managed over the API/dashboard, not here. A
# signed-in account creates a project and then one or more destinations; the
# dispatcher resolves the project's verified destinations at delivery time.
